schema: code-release-manifest-v3
title: Speaker-Composition Sensitivity of Frozen-Embedding Dialect Distance
status: published_and_anonymously_verified
publication:
  github_owner_repository: AdML123/speaker-composition-dialect-distance
  visibility: public
  default_branch: main
  release_tag: v1.1.6
